name: Finalize Pro House custom-domain SEO

on:
  push:
    branches:
      - agent/seo-local-pages
    paths:
      - .github/workflows/finalize-custom-domain-seo.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SEO branch
        uses: actions/checkout@v4
        with:
          ref: agent/seo-local-pages
          fetch-depth: 0

      - name: Switch SEO references to prohouse.sa
        run: |
          python - <<'PY'
          from pathlib import Path

          old = 'https://prohouse-sa.github.io'
          new = 'https://prohouse.sa'
          files = [
              Path('index.html'),
              Path('en/index.html'),
              Path('menu/index.html'),
              Path('healthy-meals-jeddah/index.html'),
              Path('meal-subscriptions-jeddah/index.html'),
              Path('branches/al-rawdah/index.html'),
              Path('branches/al-shati/index.html'),
              Path('robots.txt'),
              Path('sitemap.xml'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              path.write_text(text.replace(old, new), encoding='utf-8')

          Path('CNAME').write_text('prohouse.sa\n', encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm -f .github/workflows/finalize-custom-domain-seo.yml

      - name: Validate custom-domain SEO
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import xml.etree.ElementTree as ET

          pages = [
              Path('index.html'),
              Path('en/index.html'),
              Path('menu/index.html'),
              Path('healthy-meals-jeddah/index.html'),
              Path('meal-subscriptions-jeddah/index.html'),
              Path('branches/al-rawdah/index.html'),
              Path('branches/al-shati/index.html'),
          ]

          for page in pages:
              text = page.read_text(encoding='utf-8')
              if 'https://prohouse-sa.github.io' in text:
                  raise SystemExit(f'Old domain remains in {page}')
              if 'https://prohouse.sa' not in text:
                  raise SystemExit(f'Custom domain missing from {page}')
              for block in re.findall(
                  r'<script type="application/ld\+json">(.*?)</script>',
                  text,
                  flags=re.S,
              ):
                  json.loads(block)

          if Path('CNAME').read_text(encoding='utf-8').strip() != 'prohouse.sa':
              raise SystemExit('Invalid CNAME')

          ET.parse('sitemap.xml')
          for path in (Path('sitemap.xml'), Path('robots.txt')):
              text = path.read_text(encoding='utf-8')
              if 'https://prohouse-sa.github.io' in text:
                  raise SystemExit(f'Old domain remains in {path}')
              if 'https://prohouse.sa' not in text:
                  raise SystemExit(f'Custom domain missing from {path}')

          print('Custom-domain SEO validation passed.')
          PY

      - name: Commit final SEO version
        run: |
          git config user.name "Pro House Automation"
          git config user.email "noreply@prohouse.local"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Use prohouse.sa as the canonical site domain"
          git push origin HEAD:agent/seo-local-pages
